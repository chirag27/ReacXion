name: Build Android APK

# Builds the Jyotish Consult APK(s), uploads them as artifacts, AND publishes
# them to a GitHub Release for a stable, non-expiring download link.
#
#  * Every push to the app (or this workflow) / manual dispatch -> a rolling
#    pre-release tagged `android-latest` (stable URL, assets replaced each build).
#  * Pushing a tag like `android-v1.0` -> a permanent versioned release.
#
# A debug APK always builds. A SIGNED release APK also builds when the keystore
# secrets are configured (see astro/android/README.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    branches: [ "claude/brave-mendel-K3Jn7" ]
    tags: [ "android-v*" ]
  workflow_dispatch:

permissions:
  contents: write          # required to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded — will build a signed release APK."
          else
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret set — building debug APK only."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build signed release APK
        if: steps.keystore.outputs.have_keystore == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jyotish-consult-apks
          path: |
            astro/android/app/build/outputs/apk/debug/app-debug.apk
            astro/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'android-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Jyotish Consult — latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          fail_on_unmatched_files: false
          body: |
            Automated build of the Jyotish Consult Android app.
            - `app-debug.apk` — installable directly (debug-signed).
            - `app-release.apk` — present only when release signing secrets are configured.
          files: |
            astro/android/app/build/outputs/apk/debug/app-debug.apk
            astro/android/app/build/outputs/apk/release/*.apk

name: Build Android APK

# Builds the Jyotish Consult debug APK and uploads it as a downloadable artifact.
# Runs on pushes that touch the app (or this workflow), and on manual dispatch.

on:
  push:
    branches: [ "claude/brave-mendel-K3Jn7" ]
    paths:
      - "astro/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jyotish-consult-debug-apk
          path: astro/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
